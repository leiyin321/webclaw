  <text x="344" y="482" fill="#202124" font-family="monospace" font-size="13">const choice = await window.confirm(</text>
  <text x="344" y="506" fill="#202124" font-family="monospace" font-size="13">  'Continue with this page action?'</text>
  <text x="344" y="530" fill="#202124" font-family="monospace" font-size="13">);</text>
  <text x="344" y="554" fill="#202124" font-family="monospace" font-size="13">return { choice };</text>

