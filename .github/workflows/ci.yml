name: CI

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: ./scripts/check-syntax.sh
      - name: Test Agent Runtime
        run: node scripts/test-agent-runtime.mjs
      - name: Test Agent Loop
        run: ./scripts/test-agent-loop.sh
      - name: Test Provider Client Metadata
        run: node scripts/test-provider-client-metadata.mjs
      - name: Test OpenAI-compatible Structured Output
        run: node scripts/test-openai-compatible-structured-output.mjs
      - name: Validate release configuration
        run: node scripts/validate-release.mjs
      - name: Build extension package
        run: ./scripts/package-extension.sh
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: webclaw-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
